<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <meta name="description" content="Entre na Delegacia Virtual para registrar e acompanhar boletins de ocorrência.">
    <!-- Fav -->
     <link rel="shortcut icon" href="../img/EscudoPMESP.png" type="image/x-icon">

    <!-- Style.css -->
     <link rel="stylesheet" href="../style/style.css">
</head>
<body>
    <header>
        <div>
            <img src="../img/EscudoPMESP.png" alt="Escudo da Polícia Militar do Estado de São Paulo">
        </div>
        <tr tabindex="0"></tr>
        <nav aria-label="Navegação principal">
            <a href="../index.html">Sobre Nós</a>
            <a href="signin.html">Entrar</a>
            <a href="signup.html">Criar Login</a>
        </nav>
    </header>
    <main>
        <form id="login" onsubmit="entrar(event)">
            <h1 tabindex="0">Entrar</h1>
            <label class="visually-hidden" for="email">E-mail</label>
            <input type="email" id="email" placeholder="E-mail" autocomplete="email" required tabindex="0">
            <label class="visually-hidden" for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required tabindex="0">
            <button type="submit" tabindex="0">Entrar</button>
            <p id="mensagem-login" class="mensagem" aria-live="polite"></p>
        </form>
    </main>
    <footer>
        <div>
            <p>Feito Por</p>
            <a href="https://github.com/Donadei1203">Gustavo Donadei</a>
            <a href="https://github.com/Rabelo76">Guilherme Rabelo</a>
        </div>
        <div>
            <a href="https://github.com/Rabelo76/Trabalho">GitHub</a>
        </div>
    </footer>
    
    <script src="../scripts/signin.js"></script>
    <script src="https://kit.fontawesome.com/2ed950e8ed.js" crossorigin="anonymous"></script>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
</body>
</html>
