<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Policial</title>
    <meta name="description" content="Painel policial para consultar e atualizar boletins de ocorrência.">
    <link rel="shortcut icon" href="../img/EscudoPMESP.png" type="image/x-icon">
    <link rel="stylesheet" href="../style/admin.css">
</head>
<body>
    <header>
        <div><img src="../img/EscudoPMESP.png" alt="Escudo PMESP"></div>
        <nav aria-label="Navegação policial">
            <a href="home-policial.html">Home</a>
            <a href="usuarios.html">Usuários</a>
        </nav>
    </header>
    <main>
        <section class="painel">
            <h1>Boletins de Ocorrência</h1>
            <p>Use o botão Visualizar para consultar os detalhes e atualizar o andamento de um boletim.</p>
            <p id="mensagem-admin" class="mensagem" aria-live="polite"></p>
            <div class="tabela-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Nº</th>
                            <th scope="col">Envolvido</th>
                            <th scope="col">Data do incidente</th>
                            <th scope="col">Natureza</th>
                            <th scope="col">Status</th>
                            <th scope="col">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="lista-bo"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="modal-bo" class="modal" aria-hidden="true">
        <div class="modal-conteudo" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
            <button id="fechar-modal" class="fechar" type="button" aria-label="Fechar">&times;</button>
            <h2 id="modal-titulo">Detalhes do B.O.</h2>
            <div id="detalhes-bo"></div>
            <form id="form-atualizacao">
                <label for="comentario_policial">Comentário adicional do policial</label>
                <textarea id="comentario_policial" placeholder="Descreva como a ocorrência foi tratada ou resolvida."></textarea>
                <label for="processo_bo">Status do B.O.</label>
                <select id="processo_bo">
                    <option value="Em Andamento">Em Andamento</option>
                    <option value="Resolvido">Resolvido</option>
                </select>
                <button type="submit">Salvar atualização</button>
            </form>
        </div>
    </div>

    <script src="../scripts/admin.js"></script>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
</body>
</html>
