<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários Cadastrados</title>
    <meta name="description" content="Painel policial com a lista de usuários cadastrados na Delegacia Virtual.">
    <link rel="shortcut icon" href="../img/EscudoPMESP.png" type="image/x-icon">
    <link rel="stylesheet" href="../style/admin.css">
</head>
<body>
    <header>
        <div><img src="../img/EscudoPMESP.png" alt="Escudo PMESP"></div>
        <nav aria-label="Navegação policial"><a href="home-policial.html">Home</a></nav>
    </header>
    <main>
        <section class="painel">
            <h1>Usuários do Site</h1>
            <p>Lista de usuários cadastrados na plataforma.</p>
            <div class="tabela-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Nome completo</th>
                            <th scope="col">CPF</th>
                            <th scope="col">E-mail</th>
                            <th scope="col">Papel</th>
                        </tr>
                    </thead>
                    <tbody id="lista-usuarios"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="../scripts/usuarios.js"></script>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
</body>
</html>
