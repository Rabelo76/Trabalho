<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <meta name="description" content="Crie uma conta na Delegacia Virtual para registrar e acompanhar boletins de ocorrência.">
    <!-- Fav -->
     <link rel="shortcut icon" href="../img/EscudoPMESP.png" type="image/x-icon">

    <!-- Style.css -->
     <link rel="stylesheet" href="../style/style.css">
</head>
<body>
    <header>
        <div>
            <img src="../img/EscudoPMESP.png" alt="Escudo da Polícia Militar do Estado de São Paulo">
        </div>

        <nav aria-label="Navegação principal">
            <a href="../index.html">Sobre Nós</a>
            <a href="signin.html">Entrar</a>
            <a href="signup.html">Criar Login</a>
        </nav>
    </header>
    <main>
        <form id="cadastro" onsubmit="cadastrar(event)">
            <h1>Criar Conta</h1>
            <label class="visually-hidden" for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Nome" autocomplete="given-name" required>
            <label class="visually-hidden" for="sobrenome">Sobrenome</label>
            <input type="text" id="sobrenome" placeholder="Sobrenome" autocomplete="family-name" required>
            <label class="visually-hidden" for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCPF(this)" inputmode="numeric" required>
            <label class="visually-hidden" for="email">E-mail</label>
            <input type="email" id="email" placeholder="E-mail" autocomplete="email" required>
            <label class="visually-hidden" for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Senha" autocomplete="new-password" required>
            <button type="submit">Cadastrar</button>
        </form>
    </main>
    <footer>
        <div>
            <p>Feito Por</p>
        </div>
        
        <div>
            <a href="https://github.com/Donadei1203">Gustavo Donadei</a>
            <a href="https://github.com/Rabelo76">Guilherme Rabelo</a>
        </div>
        <div>
            <a href="https://github.com/Rabelo76/Trabalho">GitHub</a>
        </div>
    </footer>

    <script src="../scripts/signup.js"></script>
    <script src="https://kit.fontawesome.com/2ed950e8ed.js" crossorigin="anonymous"></script>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
</body>
</html>
